# The oracle on GitHub: every function recorded as matched (progress/
# fingerprints.json) is compiled again with the game's original compiler and
# must still match. No game file is needed: the fingerprints hold hashes and
# addresses only (see tools/verify/verify.py).
#
# CLAUDE.md: CI hashes the verifier, so a changed verifier fails the build until
# the hashes below are updated in the same, reviewed change.
name: decomp

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERIFY_PY_SHA256: 19e658e96d3d2c18bfbcc849f4aebc95cf9420e1ea04492a300bb0b29d515b17
  COFF_PY_SHA256: d6947897cc104b1c63ea7421c424e6839e290812e24f5a8759c5af508dc07afd
  VCTOOLKIT2003: C:\tools\vctoolkit2003

jobs:
  oracle:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # 3.12: the toolkit unpacker uses msilib, which later Pythons dropped
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install pefile

      - name: The verifier is the reviewed one
        shell: pwsh
        run: |
          $checks = @{ "tools/verify/verify.py" = $env:VERIFY_PY_SHA256; "tools/verify/coff.py" = $env:COFF_PY_SHA256 }
          foreach ($file in $checks.Keys) {
            $hash = python -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read().replace(b'\r\n', b'\n')).hexdigest())" $file
            if ($hash -ne $checks[$file]) { throw ("$file changed (" + $hash + "): update its hash in decomp.yml in the same change") }
          }

      - name: Cache the compiler
        id: toolkit
        uses: actions/cache@v4
        with:
          path: C:\tools\vctoolkit2003
          key: vctoolkit2003-c040f6ffbc2259426dd523b7561575fe1704b58bc37092fbfe27b64aefc449f6

      - name: Get the compiler (Visual C++ Toolkit 2003 v1.01, from archive.org)
        if: steps.toolkit.outputs.cache-hit != 'true'
        run: |
          python tools/toolchain/fetch_vctoolkit2003.py "$env:RUNNER_TEMP\VCToolkitSetup.exe"
          python tools/toolchain/extract_vctoolkit2003.py "$env:RUNNER_TEMP\VCToolkitSetup.exe" C:\tools\vctoolkit2003

      - name: Every recorded function still matches
        run: python tools/verify/verify.py --fingerprints

      # CLAUDE.md: no inline assembly, naked functions, embedded bytes or #pragma tricks
      - name: The decompiled source follows the rules
        run: python tools/decomp/check_rules.py
