# Builds the hook DLL and the install package (tools/package/) on GitHub's
# Windows machines, which are free for public repositories.
#   - every push to main and every pull request: build, run the DLL tests and
#     the install-script tests, keep the zip as a download on the run's page;
#   - a version tag such as v0.1.0: the same, plus a DRAFT release with the zip.
#     The owner edits its notes and publishes it (nothing is published here).
name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # only for the draft release on version tags

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the C++ tools on this machine" }
          "HOOK_VCVARS=$vs\VC\Auxiliary\Build\vcvarsall.bat" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the DLL and run its tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File src\hook\build.ps1 -Test

      # the ready random map templates go in the package: they must be what the maker builds
      - name: Check the ready random map templates
        shell: cmd
        run: node tools/rmg/test_template_maker.js

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build the package
        shell: pwsh
        run: python tools/package/make_package.py --version $env:VERSION

      # from cmd, as a double-click starts them (Windows PowerShell 5.1 started
      # from PowerShell 7 may not find some of its own commands)
      - name: Test the install scripts (fake game folders only)
        shell: cmd
        run: python tools/package/test_scripts.py --bash "C:\Program Files\Git\bin\bash.exe" --work-dir "%RUNNER_TEMP%\pkgtest"

      - uses: actions/upload-artifact@v4
        with:
          name: open-homm5-${{ env.VERSION }}
          path: build/package/open-homm5-${{ env.VERSION }}.zip

      - name: Draft release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:VERSION.md"
          if (-not (Test-Path $notes)) { throw ("no release notes " + $notes + ": write them before tagging") }
          gh release create $env:GITHUB_REF_NAME "build/package/open-homm5-$env:VERSION.zip" --draft --title "open-homm5 $env:VERSION" --notes-file $notes
