; H5 Together settings.
;
; Every line below that starts with ";" is a setting that is NOT changed: the value
; shown is what the add-on uses when the line is not there. To change a setting,
; delete the ";" at the start of its line and type your value. Save the file, then
; restart the game. Most settings can also be changed in the game: main menu,
; Options, H5 Together (or the F3 key); that page changes this file the same way.
;
; All players of the same co-op game should use the same settings.

[net]
; Faster network timings, so AI turns in co-op games are quicker.
; 1 = on, 0 = off (the game's own timings).
;tuning=1
; More time for a PC that joins a game, in seconds. The game gives up on a PC that sends
; nothing for 20 seconds; a PC that joins a random map game first builds the map, and a
; big map on a slower PC takes longer than that ("timeout 0.18.0"). While players join,
; the limit is this; once the game runs, the game's own 20 seconds again (a crashed
; player is dropped as fast as before). 0 = the game's own 20 seconds.
;join_timeout_s=300
; How often an idle link sends something, in milliseconds (the game: 1000).
;keepalive_ms=10
; How often a link may send a packet, in milliseconds (the game: 50).
;send_interval_ms=2
; How many "segment done" reports an idle PC holds back (the game: 3).
;batched_segments=0
; LAN games over ZeroTier and other VPNs: the "any games here?" message also goes
; into every network adapter (1 = on, 0 = only where the game itself sends it).
;lan_all_adapters=1
; Hosts to also ask directly, for VPNs without broadcasts (e.g. 10.21.174.28).
; Several: separate them with commas.
;lan_peers=
; Quicker multiplayer steps: each frame, take in every "segment done" report that has
; arrived from the other PCs (the game: only one per frame). 1 = on, 0 = off.
;drain_reports=1
; How long after its step a move is shown, in milliseconds (50 to 400), while the faster
; co-op timing is ON; otherwise the game keeps its own 400. Lower = moves start sooner
; after a click; too low for your connection = a move may start with a small jump.
; The log suggests a value for your games ("suggested view_delay_ms").
;view_delay_ms=50
; Write a summary to h5-together.log every 10 s: who this PC waits for, and how long, and
; how long this PC's own commands (clicks, AI moves) took to run and to be shown.
;trace_lockstep=1
; How far this PC's step timer may move in one frame, in ms, while the faster co-op timing
; is ON (the game: 150): after a freeze, the PC catches up instead of holding everyone back.
;catch_up_ms=600
; The game slows a PC that runs ahead of the others: 5% for each step of lead. That rule was
; made for its own 200 ms steps; with the faster co-op timing's shorter steps it brakes 2 to 4
; times harder. 1 = while the faster co-op timing is ON, brake as much per millisecond of
; lead as the game does with its own steps; 0 = the game's rule.
;scale_pacing=1
; A PC that falls behind the others (a slow frame, a busy moment) makes everyone wait for
; it. 1 = while the faster co-op timing is ON, a PC 2 or more steps behind the others runs
; up to 50% faster until it has caught up; 0 = the game's rule (it never runs faster).
;catch_up_behind=1
; How long the network part of the game rests between its rounds, in ms (1 to 10; the
; game: 10). Lower = messages go out and are read sooner.
;net_sleep_ms=1

[coop]
; Faster co-op AI moves: shorter "segments" (the steps in which all PCs move the
; game forward together), used only when EVERY player has the add-on with the same
; settings; otherwise the game keeps its own timing. The log says which happened.
; 1 = take part, 0 = never (as if this PC had no add-on).
;guard=1
; 1 = ask for shorter segments, 0 = ask for the game's own 200 ms (then nobody switches).
;fast_segments=1
; The shorter length, in milliseconds: 100 or 50.
;segment_ms=50
; Undo End Turn. With simultaneous turns, a player who pressed End Turn too early
; gets a "Resume my turn" button under the game's "Please wait for the other
; players..." banner, while another human still plays; a click gives the turn back on
; every PC at the same moment. Every PC needs a DLL that knows it (whatever its own
; setting); otherwise there is no button. Only the host's setting counts, from the
; next game. 1 = on, 0 = off (the game's own rule).
;undo_end_turn=1
; Endless simultaneous turns, for the 2008 game without MMH5.5 (with MMH5.5, its own
; PEST does this, and this line changes nothing). With "simultaneous turns" ticked in
; the waiting room, the original game lets the humans play at the same time only until
; their heroes get close; with this, simultaneous turns last the whole game (as MMH5.5's
; PEST, by Deflaktor: a battle between three players and the like are ignored). Every
; PC needs a DLL that knows it; only the host's setting counts, from the next game.
; 1 = on, 0 = off (the game's own rule).
;endless_turns=1
; MMH5.5's scripts at their own pace. MMH5.5's scripts count their waits in game
; steps, made for the game's 200 ms steps: with the faster co-op steps above, its main
; script loop would check every hero four times as often as MMH5.5 intends (more work
; for every PC, a choppier map). With this, the scripts move on once per 200 ms of
; game time, as in the original game. Every PC needs a DLL that knows it (whatever its
; own setting); otherwise it is off. Only the host's setting counts, from the next
; game. 1 = on, 0 = off.
;script_rhythm=1
; Quick resume after a crash. When a player's game crashes or loses its connection,
; the host's game drops that player after about 20 seconds and plays on without them
; (they count as defeated). With this, the host first has every PC save the game, with
; that player still in it, as "Resume" ("Reprise" in French): to play on together,
; everyone goes to Multiplayer, LAN, Create, Load. Only the host's setting counts.
; It changes nothing in the game itself, so it is on. 1 = on, 0 = off.
;resume_save=1
; Following a friend's view. In a multiplayer game, a click on an ally's name in the
; player list makes your camera follow theirs (click again, or move the camera, to
; stop); an eye next to a name shows who follows whom. Only allies, and each sees the
; map through their own fog. With 1, your allies may follow your view (your PC then
; sends where your camera looks, a few times a second, while one of them follows); 0 =
; your view stays yours. Each player chooses. It applies at once from the Options page.
;share_view=1
; Watching the followed ally's battles. While you follow an ally's view and they fight, a
; "Watch the battle" button shows that battle live, with the game's own battle screen (your
; PC runs every battle anyway), even when it has begun. You only watch: the battle's buttons
; do nothing, and your PC sends nothing while it shows. "Stop watching" (or Esc) brings you
; back to the map; their battle goes on. 1 = the button, 0 = no button. It applies at once.
;watch_battles=1
; Staying after a defeat. When you lose the game (your last hero and no town) while your
; friends play on, closing the game's results keeps you in the game instead of going back to
; the lobby: you play no more, and you can follow your team and watch their battles. Esc, Quit
; leaves. 1 = stay, 0 = back to the lobby as in the original game. It applies at once.
;stay_after_defeat=1

[ai]
; Faster AI pathfinding. The AI finds exactly the same paths, only sooner.
; 1 = on, 0 = off (the game's own pathfinding).
;fast_paths=1
; The parts of fast_paths. Each one can be turned off on its own (1 = on, 0 = off).
; They only matter while fast_paths=1.
;remember_checks=1
;fast_queue=1
;port_relax=1
;port_search=1
;port_expand=1
;fast_ashore=1
; Testing only: 1 = also ask the game every time and log any difference (slow).
;ashore_check=0
; In co-op games the computer players take at most one decision per frame, and only
; once their last moves have happened, as with the game's own timing (the faster co-op
; timing let them take several in one frame, on a world without their last moves).
; 1 = as the game, 0 = as the add-on 0.2.0 to 0.2.3.
;one_decision_per_frame=1
; EXPERIMENT, CHANGES THE AI'S PATHS. A map tile is expanded at most this many times
; per search. 0 = off. Not for real games.
;max_expansions=0
; The computer players take their turns at the same time, instead of one after
; another: much shorter waits with several of them (robot: about 40% less with 2 or 3).
; They may decide differently than in the original game (each one sees the others'
; moves as they happen), so it is off by default. Multiplayer only: every PC needs a
; DLL that knows it (whatever its own setting); only the host's setting counts, from
; the next game. 1 = on, 0 = off.
;parallel_turns=1

[save]
; Autosaves in co-op games.
; At each autosave the game reads every multiplayer save in your profile's Saves folder,
; several times. With many old saves there, everyone froze for seconds at the start of
; each round. With this on, those reads skip a slow step that saves don't need (the
; saves stay exactly the same). 1 = on, 0 = the game's own slow reads.
;fast_save_list=1
; Each game its own autosaves. The game names its autosaves "Autosave 1, 2, 3" ("Sauvegarde
; auto" in French) and overwrites the oldest of the three, whatever the game: a new game
; replaces the autosaves of the one you played yesterday. With 1, each game's autosaves
; carry its map's name and a short code of the map ("6P-epic [9D92] - Autosave 1"), and
; each game keeps its own three. In multiplayer the PC that asks for the autosave names it
; for every PC. 0 = the game's own names. Restart after a change.
;game_names=1
; Write a line to h5-together.log for each autosave: who asked, how long each PC took.
; 1 = on, 0 = off.
;trace_autosave=1
; How hard saves are compressed: 1 = fast (files about a quarter bigger), up to 9 =
; smallest and slowest. -1 = the game's own setting (6). The game loads them all.
;compression=1
; Autosave only every N days: 1 = every day (as the game), 2 = every other day,
; 7 = once a week (on the first day of the week).
;autosave_every=1

[notify]
; "Your turn" notification: when you can play again (the computer players are done,
; or the turn passes to you) and the game is NOT the window in front, the game's
; taskbar button flashes until you come back. Not on the first turn of a game.
; 1 = on, 0 = off.
;turn=1
; Also play a short sound (Windows' notification sound; a short chime on Linux).
; 1 = on, 0 = off.
;sound=1
; Also show a notification pop-up (Windows; on Linux it may not show). 1 = on, 0 = off.
;popup=1
; Testing only: 1 = write every change of the players' turns to the log.
;trace=0

[ui]
; The player list on the adventure map's left edge: the day, how many players are
; ready, and for each player the hero's portrait, the name and the turn: green dot =
; playing, tick = turn ended, three dots = the computer is moving, ring = waiting.
; It only shows what the game knows: each player can choose. 1 = on, 0 = off.
;player_list=1
; The key that hides it or shows it again: F1 to F12, or none.
;player_list_key=F9
; Where it starts, in % of the screen's height: from the top, and from the left edge.
; Like the game's own buttons, it grows with the screen's height. With many players it
; moves up by itself, so it never covers the minimap.
;player_list_top=34
;player_list_left=2
; The words of the add-on's panels and messages (the player list's and every other):
; auto = the game's language (Steam's language for the game, else the game's own
; texts, else Windows'), or the code of a language file in h5-together\texts:
; en = English, fr = French. A language without a file shows in English.
;language=auto
; The multiplayer waiting room: the tooltip of a starting hero also tells its class, its
; starting skills and what its specialty does (the game's own words). 1 = on, 0 = off.
;hero_tips=1
; The skill wheel: what a hero's class can learn, what each ability needs first, and what the
; hero has. 1 = a small wheel button on the hero screen (the original game only: MMH5.5 has its
; own wheel there), 0 = no button.
;skill_wheel=1
; A key that opens it for the selected hero (F1 to F12), or none.
;skill_wheel_key=none
; Testing only: 1 = write every change of a player's turn to the log.
;trace_players=0
; Testing only: show this many rows (copies of the real players, in teams of two).
;player_list_test_rows=0
; Testing only: 1 = a key (F10) opens a small test panel on any screen, to check that
; while it is open the game behind gets no click and no key. Esc closes it.
;overlay_test_panel=0
; The test panel's key: F1 to F12 (F10 also opens the game's menu on the adventure map).
;overlay_test_key=F10

[rmg]
; Teams on maps that have none of their own, such as random maps. Only the HOST's
; setting counts: every player gets the host's teams when the game starts.
; (empty) = the map's own teams (every player alone on a random map)
; humans_vs_ai = all humans together against all computer players
; pairs = players 1+2, 3+4, 5+6, 7+8 together (for the "2v2", "2v2v2" templates)
; 1,1,2,2,3,3 = a team for each player, in the map's order (player 1, 2, 3...)
;teams=
; Pick teams in the lobby: on maps without teams of their own, the team arrows of each
; player's row choose a team number (1, 2, 3...) instead of moving the player to another
; colour. Only the HOST's setting counts; the others need nothing. 1 = on, 0 = off.
;lobby_teams=0
; Write the teams each PC starts with into h5-together.log (1 = on, 0 = off).
;trace_teams=1
; Maps made from a recipe template (OH-X1-..., the template builder's) get the template's
; teams: for example 3 teams of 2 = players 1+2, 3+4, 5+6. The setup screen and the lobby
; show them from the start, and on these maps the team arrows choose teams, so players
; can still change them. teams= still wins. 1 = on, 0 = off.
;recipe_teams=1
; Random map templates from the folder h5-together\templates next to the game's exe
; (made with the template maker) appear in the game's template list. Every player of a
; multiplayer game needs the same templates. Also templates named by their recipe, such
; as OH-X1-321110nnxxxxxxxa: their name holds every choice, so each PC builds the same
; template from the name alone, with no file. 1 = on, 0 = off (both). Even when off, a
; game whose template this PC lacks shows the game's "can't make the map" message
; instead of crashing.
;templates=1
; Recipe templates to offer in the game's template list, for example
; OH-X1-321110nnxxxxxxxa (2v2v2, Normal, with underground). Several: separate them with
; commas. A recipe the game asks for (the template of a game you join) is always built,
; even when it is not here. How to read the names: tools/rmg/README.md at
; https://github.com/jozrcr/h5-together
;recipes=
; The template builder: a "Template..." button on the game's random map screen opens a
; panel with every choice of the web template maker. "Use" sets the game's screen to
; that template (size, underground, players, "ARMG Templates"); then Create and Save as
; usual. The template is named by its recipe, so your friends need no file.
; It needs templates=1. 1 = on, 0 = off (no button, no panel).
;builder=1
; The key that also opens the builder on the random map screen: F1 to F12, or none.
;builder_key=F11
; The last choices used or saved in the builder (a recipe name): the panel writes it.
;builder_last=

; Start terrain that matches each player's faction, on random maps. When the HOST
; turns it on, every player may pick any faction in the lobby; at the start, every PC
; rebuilds the map with the factions picked, so each start zone gets its faction's
; ground, decorations, town and dwellings. Players left on "Random" keep the faction
; the map was made with. It takes a few seconds more to start (the time to build the
; map), only when someone picked another faction. Every human player needs a DLL
; with this mod (whatever their own setting); otherwise the map stays as it is.
; It changes the game (heroes walk faster on their own faction's ground), so it is
; off by default. Only the host's setting counts. 1 = on, 0 = off.
;faction_terrain=1
; Research: log the lobby setups, the start, the map builds and the map files opened.
;trace_factions=0

[audio]
; The original Heroes V music wherever MMH5.5 changed it (main menu, credits, terrains,
; battles, hero themes). Nothing on disk changes.
; 0 = MMH5.5's music (as without the add-on), 1 = the original music.
; Each player can choose: it does not matter for co-op games.
;original_music=0
; Testing only: 1 = write the name of every music file the game starts to the log.
;log_music=0
; The volume sliders (Options, Audio: music and sounds). game = the game's own sliders.
; wide = the same sliders with a wider range: each step about the same number of
; decibels, so the lowest step (10%) is 10 times quieter than the game's and the
; highest (100%) is unchanged. The sliders and your profile keep their values.
; Each player can choose: it does not matter for co-op games.
;volume_curve=wide
; Testing only: write the first N changes of a channel's volume to the log.
;log_volume=0

[lang]
; The language of the game's texts. With MMH5.5, a French game shows some texts in
; English (the 3.1 patch's and MMH5.5's). fr = everything in French: the texts come from
; the French packs (.pak) in the folder h5-together\lang\fr next to the game's exe, where
; they have them: MMH5.5's own French pack (from MMH5.5's ModDB page) and the pack of
; what it leaves out. Nothing on disk changes. game = the texts as installed.
; Each player chooses for themselves. Restart the game after a change.
; (en = English is planned, not available yet.)
;texts=game
; Testing only: write the first N texts taken from the packs to the log.
;log_texts=0

[camera]
; How far the camera may zoom out (mouse wheel, Page Up / Page Down), in % of how far
; the game itself allows. 100 = the game's own limit; 150 = one and a half times as far;
; at most 400. The closest zoom and the camera's angle stay the game's.
; Only your screen changes: each player can choose, it does not matter for co-op games.
; Far out you may see past the map's edge, and on big maps the game may run less smoothly.
; Adventure map:
;zoom_out=100
; Battles:
;combat_zoom_out=100
; Where the adventure map's camera starts, as a distance: the game starts at 25, its
; farthest is 70 (times zoom_out). Empty or 0 = the game's own start.
;start_zoom=
; Linux (Wine / Proton): the mouse wheel may zoom in but never out, because Wine
; reports the wheel differently from Windows. auto = under Wine only, the DLL checks
; the first wheel turns and fixes them if needed; nothing changes on Windows.
; 1 = fix from the first turn (only if auto did not help on Linux; never on Windows).
; 0 = off. Page Up / Page Down zoom too, without any fix.
;wheel_fix=auto
; What you see past the map's edge. game = the game's sky: on many random maps a flat
; violet, MMH5.5's dusk sky. none = black there, like unexplored land. Battles keep
; their sky. Only your screen changes: each player can choose. Restart after a change.
;edge_sky=game
; Testing only: one more light file (a path in the game data) to show without its sky.
;edge_sky_test_light=
; Lighter animations when the map is slow. Zoomed far out on a big map, most of each
; frame goes into animating the 3D models (heroes, creatures, buildings). With 1, when
; the adventure map drops below about 55 frames a second, each model moves on only 1
; frame in 2 to 4 (robot, a 6-player map zoomed out at 2560x1440: 36 -> up to 50 frames
; a second); above 80 it is every frame again. Battles and towns are not affected. Only
; your screen changes: each player can choose. Restart after a change. 1 = on (the
; default), 0 = off (the game's own way: every model on every frame).
;anim_saver=1
; The size of the game's shared pool for the 3D models' vertices, in times the game's own
; size. The game made it for its own zoom: zoomed far out on a big map it overflows, and
; the game then throws all the models away and builds them again, every other frame
; (robot, a 6-player map zoomed out at 2560x1440: 36 -> 49 frames a second with 4). The
; picture is the same. 4 = about 80 MB more video memory. 1 = the game's own size, up
; to 16. Restart after a change.
;vertex_pool=4

[video]
; A frame rate limit: at most this many frames a second (30 to 240; 0 or nothing = no
; limit, the game's own). The game draws as many frames as it can, up to about 400 a
; second in its menus: a limit keeps the PC cooler and quieter. Only your screen
; changes: each player can choose. It applies at once from the Options page.
;fps_limit=180
; The vertical sync: 1 = each frame waits for the screen's refresh (no tearing), 0 =
; never, game = the game's own setting (its hidden gfx_vsync, off on most PCs). Only your
; screen. Restart after a change.
;vsync=game
; Keep the game running when another window has the focus (the game's own
; app_always_active, read as on; your profile is not changed): 2 = under Linux (Wine,
; Proton) only, where the "not responding" box during a big map's build took the focus
; and the join failed; 1 = on Windows too; 0 = the game's own (it pauses, and minimizes
; itself in fullscreen).
;background=2
; MMH5.5's HD textures in the original game. When the 2008 game's own exe (Steam's
; H5_GameOLD.exe after the GameRanger guide) starts in a folder where MMH5.5 is
; installed, H5 Together hides MMH5.5's files from it, so it is the original game (MMH5.5
; still starts as before from its own exes; no file is changed). 1 = keep MMH5.5's
; sharper textures (terrain, towns, sky: MMH55-HDTex.pak), 0 = hide them too. Only your
; screen. Restart after a change.
;hd_textures=0

[menu]
; The picture behind the main menu, and its music. The menu's buttons and the logo stay as
; they are.
; default = as installed (nothing changes; with MMH5.5 that is the Heroes V picture with
;           MMH5.5's music)
; toe = the Tribes of the East picture (orcs and goblins storming a town wall) with its music
; homm5 = the Heroes V picture with its music (it needs MMH5.5, which brings that picture)
; random = one of the pictures this PC can show, drawn each time the game starts
; A picture this PC cannot show falls back to default (the log says why).
; Only your screen and your speakers change: each player can choose. Restart after a change.
;scene=default

[skins]
; Hero looks: a hero can wear the look (the 3D figures on the map, in battle and on the
; hero screen) of another hero of the same faction. The choices are in
; h5-together-skins.ini, next to this file, one line per hero, by the hero's internal
; name, for example:
;   [skins]
;   Godric=Freyda
; Your choices count for your own heroes. Computer players' heroes keep their looks.
; Portraits, skills and everything the rules use stay the hero's own.
; In a multiplayer game the looks show only if every player has H5 Together (the same
; version of the game data too): then everyone sees everyone's looks. If one player
; lacks it, everyone sees the normal looks in that game, so the PCs stay in sync.
; 1 = on (it changes nothing until a look is chosen), 0 = off.
;skins=1
; The key that opens the looks' panel for your selected hero (on the map, the hero
; screen or the town screen): F1 to F12, or none. Apply saves the choice; in a
; multiplayer game it shows for everyone a few seconds later.
;key=F7
; 1 = a small "Look" button on the hero screen, in the "Army & Stats" header
; (French: "Armee & Stats"), next to MMH5.5's two buttons (it shows the portrait
; of the hero's look); 0 = no button.
;hero_screen_button=1
; Its place, in the game's 1024x768 layout (the screen's height counts as 768):
;hero_screen_button_x=403
;hero_screen_button_y=94
; 1 = after Apply on the hero screen, it closes and opens again at once (on the
; same page) to show the new 3D figure, as its "next hero" arrow does; 0 = the
; figure changes the next time you open the hero screen.
;live_hero_screen=1
; 0 = take no part in multiplayer looks (then nobody's looks show in those games).
;show_others=1
; Testing only: 1 = log each figure built.
;trace=0

[rules]
; Game rules chosen by the host: MMH5.5's own switches (governors, town conversion,
; town gate, mine guards, computer bonus, mixed neutral armies, prank artifacts, the
; random map extras...) for every player of the game, with no file to swap. The host
; picks them in a panel: press F2 on the game setup screen or in the waiting room, or
; click "Rules..." in the waiting room. The other players see them there (read only),
; and everyone can see the rules of the running game with F2 on the adventure map.
; They are used only when EVERY player has the add-on; otherwise every PC uses its own
; MMH5.5 settings file, as without the add-on (the log and the panel say which).
; In multiplayer, MMH5.5's scripts run by themselves only on maps that have a map
; script: hand-made maps, and random maps saved with one (MMH5.5's Mapmixer, or the
; map editor). On a random map straight from the game's generator they do not run
; with MMH5.5 RC19d (RC19k runs them), and then these rules change nothing there.
; The rule map_scripts ("MMH5.5 scripts on random maps") decides it for every PC.
; 1 = take part, 0 = never (no hello to the host, always this PC's own file).
;enabled=1
; The panel's key: F1 to F12, or none.
;key=F2
; The "Rules..." button in the waiting room: 1 = shown, 0 = the key only.
;button=1
; The host's choices, written by the panel when you press OK. Empty = MMH5.5's file.
; On/off: 1 = on, 0 = off. ai_cheat: 0 = off, 1 to 6 = 40% to 140% (4 = 100%).
; extra_conversions: 0 to 10. Multipliers: 0.5 to 3 (1 = MMH5.5's).
;governance=
;town_conversion=
;extra_conversions=
;town_gate=
;mine_control=
;dimension_doors=
;ai_cheat=
;mixed_stacks=
;neutral_stack_size=
;bank_difficulty=
;negative_artifacts=
;rpg_potions=
; MMH5.5 scripts on random maps: 1 = MMH5.5's scripts also run on maps without a
; map script (a random map straight from the generator) in multiplayer, 0 = they do
; not (as in the original game). Not in MMH5.5's file: empty = what this PC's MMH5.5
; does by itself (RC19d: 0, RC19k: 1). A save keeps what its game started with.
;map_scripts=
;competitive_towns=
;mana_observatories=
;moon_disc=
; Game mode and start bonuses (the first group of the panel). In MMH5.5 the lobby's
; bonus arrows choose the game mode (artifact = Default, gold = Savage, resources =
; Nightmare) and nobody keeps the bonus. game_mode: 0 = like that (MMH5.5's way),
; 1 = Default, 2 = Savage, 3 = Nightmare, 4 = Random (one of the three, drawn at the
; start), for everyone. toe_bonuses: 1 = each player keeps the start bonus picked
; with the arrows, as in Tribes of the East (gold, resources or a minor artifact),
; and MMH5.5's start artifact is not given; then game_mode 0 means Default. 0 = off.
; Both need every PC to have the same MMH5.5 start script; otherwise MMH5.5's way.
;game_mode=
;toe_bonuses=
; Skills of each class (the panel's "Heroes and skills"). In MMH5.5 each of its 24
; classes is only ever offered the 12 skills of its list. class_skills: 0 = like that
; (MMH5.5's way), 1 = unlocked: every class keeps its list and chances, and each
; other skill MMH5.5 offers to some class can come up too, rarely (chance 2, as the
; rare skills of Tribes of the East; MMH5.5's lists add up to 100). Attribute growth,
; the witch huts and MMH5.5's skill wheel (hero screen) stay MMH5.5's. Needs every
; PC to have the same MMH5.5 class table; otherwise MMH5.5's way. A save keeps it.
;class_skills=
; Testing only: the chance of those other skills (1 to 50, empty = 2). It travels
; with the host's rules, so every PC uses the host's.
;class_chance=
; Testing only: 1 = write every new skill a level-up offers to the log.
;trace_skills=0
; Testing only: 1 = a single-player game uses class_skills and class_chance above.
;class_skills_single=0
; Testing only: 1 = write every script file the game opens to the log, and print each
; player's start resources and minor artifacts to the game's console.
;trace=0

[debug]
; The hang watchdog: if the game stops answering (its window "not responding") for a
; while, write where it is stuck into h5-together.log, once per freeze. It only looks:
; it never closes, stops or changes the game. Send us the log after a freeze.
; 1 = on, 0 = off.
;hang_watchdog=1
; How long the game must stop answering before the watchdog looks, in seconds (5 to 600).
; A long loading screen can count too; it then gets one look, and the log says it was
; only slow.
;hang_seconds=20
; Testing only: 1 = the F12 key freezes the game on purpose for 25 seconds (while the
; game is the window in front), to check that the watchdog writes its report.
;hang_test=0
; Crash reports: if the game crashes, write what crashed (h5-together-crash-<date>.txt)
; and a small minidump (the .dmp, for us to look into it) next to the log. The 3 newest
; are kept. Nothing is sent anywhere: bug-report.bat adds the newest to a bug report.
; After the crash the game closes as before. 1 = on, 0 = off.
;crash_report=1
; Testing only: 1 = write the mouse wheel's input to the log (what DirectInput and the
; game's window get, and the wheel fix's check), for wheel problems.
;trace_wheel=0

[update]
; "New version available": 1 = at most once a day, when the main menu shows, ask GitHub
; (github.com, where the add-on comes from) for the number of its latest version, and if
; it is newer than yours, say so in the main menu. Only that question is sent: nothing
; about you or your game (GitHub sees your internet address, as any website does).
; Nothing is ever downloaded or installed. 0 = never ask (the default).
;check=0
; Written by the add-on: when it last asked, and the latest version it was told.
;last_check=
;latest=
; Written by the add-on: 1 once you answered the question about this check, the first
; time the game started with H5 Together (it is asked only once).
;asked=

[chain]
; Another mod that is also a dinput8.dll (an "ASI loader" for a widescreen fix, for
; example): only one file can have that name. Rename the other mod's file to
; dinput8_next.dll: H5 Together then loads it when the game starts and passes DirectInput
; on to it (the log says "chained"). Or write its file name here (next to the game's exe,
; or a full path). none = never load another mod. Restart the game after a change.
;dll=dinput8_next.dll

[online]
; Online play over Steam (being tested; Options > H5 Together > Online play sets it).
; off = the game's own LAN play, as without the add-on. steam = the LAN list
; (Multiplayer > LAN) shows Steam friends' games, the host can invite friends from the
; waiting room (needs Steam and Valve's steam_api.dll in bin\h5-together\).
; loopback = the add-on's own tests. Restart the game after a change.
;mode=steam
